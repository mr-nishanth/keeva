name: Keeva CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compliance:
    name: Repository Compliance & Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Secret Leak Check (Tracked Files)
        run: |
          echo "Scanning for accidentally tracked sensitive files..."
          LEAKED_FILES=$(git ls-files | grep -iE '\.jks|\.keystore|key\.properties|local\.properties|\.pem|\.p12' || true)
          if [ -n "$LEAKED_FILES" ]; then
            echo "::error::Sensitive files detected in git index:"
            echo "$LEAKED_FILES"
            exit 1
          fi
          echo "✓ No sensitive files or credentials tracked in git."

      - name: Android Manifest Permission Regression Check
        run: |
          echo "Verifying absence of sensitive permissions in Android source manifest..."
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "::error::android.permission.INTERNET declared in $MANIFEST"
            exit 1
          fi
          if grep -q "android.permission.MANAGE_EXTERNAL_STORAGE" "$MANIFEST"; then
            echo "::error::android.permission.MANAGE_EXTERNAL_STORAGE declared in $MANIFEST"
            exit 1
          fi
          echo "✓ Zero sensitive permissions in source manifest."

      - name: Application ID & Namespace Regression Check
        run: |
          echo "Validating application ID and namespace declarations..."
          GRADLE_FILE="android/app/build.gradle.kts"
          grep -E 'namespace = "io\.nishvanta\.keeva"' "$GRADLE_FILE" || {
            echo "::error::Namespace mismatch in $GRADLE_FILE"
            exit 1
          }
          grep -E 'applicationId = "io\.nishvanta\.keeva"' "$GRADLE_FILE" || {
            echo "::error::applicationId mismatch in $GRADLE_FILE"
            exit 1
          }
          if grep -q "com.example.whatsapp_status_saver" "$GRADLE_FILE"; then
            echo "::error::Legacy package found in $GRADLE_FILE"
            exit 1
          fi
          if [ -d "android/app/src/main/kotlin/com/example" ]; then
            echo "::error::Legacy package directory exists in main source set"
            exit 1
          fi
          if [ -d "android/app/src/test/kotlin/com/example" ]; then
            echo "::error::Legacy package directory exists in test source set"
            exit 1
          fi
          echo "✓ Application ID and namespace verified: io.nishvanta.keeva"

      - name: License Verification Check
        run: |
          echo "Verifying open-source license presence and content..."
          if [ ! -f "LICENSE" ]; then
            echo "::error::LICENSE file is missing from repository root"
            exit 1
          fi
          grep -q "Apache License, Version 2.0" LICENSE || {
            echo "::error::LICENSE does not contain Apache License, Version 2.0"
            exit 1
          }
          echo "✓ Apache-2.0 license verified."

      - name: Pubspec Version Syntax Check
        run: |
          echo "Verifying pubspec.yaml version syntax..."
          APP_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "Detected version: $APP_VERSION"
          if ! echo "$APP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "::error::Invalid version format in pubspec.yaml: $APP_VERSION (expected semver+build)"
            exit 1
          fi
          echo "✓ Version format is syntactically valid: $APP_VERSION"

  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

  flutter-tests:
    name: Flutter Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

  android-tests:
    name: Android JVM Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Project
        run: flutter build apk --config-only

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Run Android JVM Tests
        run: |
          cd android
          ./gradlew test

  release-build:
    name: Release Build & Artifact Validation
    needs: [compliance, formatting, analyze, flutter-tests, android-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Project
        run: flutter build apk --config-only

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Ensure Fallback Signing Keystore
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f "$HOME/.android/debug.keystore" "$HOME/.config/.android/debug.keystore" 2>/dev/null || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Validate Release APK Identity & Privacy
        run: |
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt -type f | sort -V | tail -n 1)
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            AAPT=$(command -v aapt || true)
          fi
          if [ -z "$AAPT" ]; then
            echo "::error::aapt tool not found in Android SDK build-tools or PATH"
            exit 1
          fi
          echo "Using aapt binary: $AAPT"
          BADGING=$("$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk)
          echo "Verifying package name..."
          echo "$BADGING" | grep -E "package: name='io\.nishvanta\.keeva'"
          echo "Verifying application label..."
          echo "$BADGING" | grep -E "application-label:'Keeva'"
          echo "Verifying absence of sensitive permissions..."
          if echo "$BADGING" | grep -q "android.permission.INTERNET"; then
            echo "::error::Release APK contains android.permission.INTERNET!"
            exit 1
          fi
          if echo "$BADGING" | grep -q "android.permission.MANAGE_EXTERNAL_STORAGE"; then
            echo "::error::Release APK contains android.permission.MANAGE_EXTERNAL_STORAGE!"
            exit 1
          fi
          echo "✓ Release APK identity and privacy safeguards verified successfully."

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Validate Release AAB
        run: |
          AAB_FILE="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -s "$AAB_FILE" ]; then
            echo "::error::Release AAB is missing or empty: $AAB_FILE"
            exit 1
          fi
          echo "✓ Release AAB exists and is non-empty."
          echo "AAB Checksum (SHA-256):"
          sha256sum "$AAB_FILE"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 3
          if-no-files-found: error
