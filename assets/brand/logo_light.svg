<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <!-- Mark Container for Light Theme -->
    <linearGradient id="markLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>

    <linearGradient id="auroraLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <radialGradient id="sparkLightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Left: Mark Container -->
  <g transform="translate(30, 30)">
    <rect width="180" height="180" rx="46" fill="url(#markLightBg)" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/>

    <path d="M 64 144 
             L 64 88 
             C 64 66, 78 52, 98 52 
             L 120 52 
             C 136 52, 146 62, 146 78 
             C 146 96, 130 110, 112 110 
             L 96 110
             C 84 110, 78 116, 78 128 
             L 78 144"
          fill="none" 
          stroke="url(#auroraLightGrad)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 94 154 
             L 128 154 
             C 144 154, 154 144, 154 128 
             L 154 110"
          fill="none" 
          stroke="#4F46E5" 
          stroke-opacity="0.35"
          stroke-width="10" 
          stroke-linecap="round"/>

    <circle cx="112" cy="80" r="18" fill="url(#sparkLightGlow)"/>
    <circle cx="112" cy="80" r="6.5" fill="#047857"/>
  </g>

  <!-- Right: Dark Typographic Lockup for Light Background -->
  <g transform="translate(250, 0)">
    <text x="0" y="142" 
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
          font-size="94" 
          font-weight="700" 
          letter-spacing="-1.5" 
          fill="#111827">Keeva</text>

    <text x="4" y="184" 
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#059669">PRIVATE MOMENTS KEEPER</text>

    <circle cx="282" cy="86" r="7" fill="#059669"/>
  </g>
</svg>
