<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <!-- Dark Background -->
    <rect id="canvasBg" width="800" height="240" fill="#090B0E"/>

    <!-- Mark Container -->
    <linearGradient id="markDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232E"/>
      <stop offset="100%" stop-color="#11141A"/>
    </linearGradient>

    <!-- Vibrant Aurora Gradient for Dark Canvas -->
    <linearGradient id="auroraDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <radialGradient id="sparkDarkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="1"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="800" height="240" rx="24" fill="#090B0E"/>

  <!-- Left: Mark Container (180x180) -->
  <g transform="translate(30, 30)">
    <rect width="180" height="180" rx="46" fill="url(#markDarkBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <path d="M 64 144 
             L 64 88 
             C 64 66, 78 52, 98 52 
             L 120 52 
             C 136 52, 146 62, 146 78 
             C 146 96, 130 110, 112 110 
             L 96 110
             C 84 110, 78 116, 78 128 
             L 78 144"
          fill="none" 
          stroke="url(#auroraDarkGrad)" 
          stroke-width="13" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 94 154 
             L 128 154 
             C 144 154, 154 144, 154 128 
             L 154 110"
          fill="none" 
          stroke="#818CF8" 
          stroke-opacity="0.45"
          stroke-width="10" 
          stroke-linecap="round"/>

    <circle cx="112" cy="80" r="20" fill="url(#sparkDarkGlow)"/>
    <circle cx="112" cy="80" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Right: Off-White Typographic Lockup -->
  <g transform="translate(250, 0)">
    <text x="0" y="142" 
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
          font-size="94" 
          font-weight="700" 
          letter-spacing="-1.5" 
          fill="#F9FAFB">Keeva</text>

    <text x="4" y="184" 
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#34D399">PRIVATE MOMENTS KEEPER</text>

    <circle cx="282" cy="86" r="7" fill="#34D399"/>
  </g>
</svg>
