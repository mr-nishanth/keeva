<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>

    <!-- Aurora Ribbon Gradient (Mint to Indigo) -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Spark Radial Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="1"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- The Inward Aperture / Moment Ribbon -->
  <!-- An elegant, continuous curvature path framing the moment -->
  <path d="M 160 360 
           L 160 216 
           C 160 160, 196 128, 248 128 
           L 304 128 
           C 344 128, 368 152, 368 192 
           C 368 240, 328 272, 280 272 
           L 240 272
           C 208 272, 192 288, 192 320 
           L 192 360"
        fill="none" 
        stroke="url(#auroraGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Secondary Memory Envelope Arc -->
  <path d="M 232 384 
           L 320 384 
           C 360 384, 384 360, 384 320 
           L 384 272"
        fill="none" 
        stroke="#6366F1" 
        stroke-opacity="0.4"
        stroke-width="24" 
        stroke-linecap="round"/>

  <!-- The Central Preserved Spark -->
  <!-- Ambient halo -->
  <circle cx="280" cy="200" r="44" fill="url(#sparkGlow)"/>
  <!-- Core gleaming beacon -->
  <circle cx="280" cy="200" r="16" fill="#FFFFFF"/>
</svg>
